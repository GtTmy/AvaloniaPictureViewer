[project]
name = "scoring-tool"
version = "0.1.0"
description = "Local photo aesthetic scoring PoC for AvaloniaPictureViewer"
readme = "README.md"
authors = [
    { name = "GtTmy", email = "tomoya.gotoh.wind@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "onnx>=1.21.0",
    "onnxscript>=0.7.0",
    "pillow>=12.2.0",
    "simple-aesthetics-predictor>=0.1.2",
    "torch>=2.11.0",
    "transformers>=4.57.6",
]

[project.scripts]
score-photo = "scoring_tool:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
